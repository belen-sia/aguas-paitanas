<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesión Cerrada - Aguas Paitanás</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to bottom, #e0f7ff, #ffffff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .btn-home {
            background-color: #1a44f7;
            color: white;
            font-weight: 500;
            border-radius: 15px;
            padding: 10px 25px;
            text-decoration: none;
        }
        .btn-home:hover {
            background-color: #0d2bb8;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-5 text-center">
            <h2 class="mb-4 text-primary">¡Sesión cerrada correctamente!</h2>
            <p class="mb-4">Gracias por visitar Aguas Paitanás. Te hemos redirigido al inicio.</p>
            <a href="{% url 'home:inicioindex' %}" class="btn btn-home">Ir al Inicio</a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
