{% extends 'includes/base_portales.html' %}
{% block content %}
<div class="container mt-5">
    <h3 class="fw-bold mb-4 text-center">Actualizar Stock - {{ producto.nombre }}</h3>

    <form method="post" action="{% url 'stock:actualizar_stock' producto.id %}" class="shadow p-4 rounded bg-light mx-auto" style="max-width: 500px;">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" name="nueva_cantidad" min="1" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Sucursal</label>
            <select name="sucursal_id" class="form-select" required>
                <option value="">Seleccione una sucursal</option>
                {% for sucursal in sucursales %}
                    <option value="{{ sucursal.id }}">{{ sucursal.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de Movimiento</label>
            <select name="tipo_movimiento" class="form-select" required>
                <option value="">Seleccione tipo</option>
                <option value="ENTRADA">Entrada (suma)</option>
                <option value="SALIDA">Salida (resta)</option>
                <option value="AJUSTE">Ajuste (modifica)</option>
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a href="{% url 'productos:gestion_productos' %}" class="btn btn-secondary">← Volver</a>
            <button type="submit" class="btn btn-success">Actualizar Stock</button>
        </div>
    </form>
</div>
{% endblock %}
