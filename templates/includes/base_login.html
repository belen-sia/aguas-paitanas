<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aguas Paitanás{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- CSS propio -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="container d-flex justify-content-center align-items-start min-vh-100 py-5">
        <div class="card p-5 rounded-card mx-auto" style="max-width: 600px; width: 100%;">

            <!-- Logo -->
            <div class="text-center mb-4">
                <img src="{% static 'assets/logohorizontal.png' %}" alt="Aguas Paitanás" class="logo">
            </div>

            <!-- Contenido de la página -->
            {% block content %}
            {% endblock %}

        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
